name: Backup PostgreSQL DB

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          PG_VERSION=$(apt-cache search postgresql-client- | grep -oP 'postgresql-client-\d+ ' | grep -oP '\d+' | sort -rn | head -1)
          echo "Instalando postgresql-client-$PG_VERSION"
          sudo apt-get install -y "postgresql-client-$PG_VERSION"
          echo "/usr/lib/postgresql/$PG_VERSION/bin" >> "$GITHUB_PATH"

      - name: Generate filename with timestamp (Bolivia timezone)
        id: date
        run: echo "date=$(TZ='America/La_Paz' date +%Y-%m-%d_%H-%M-%S)" >> $GITHUB_OUTPUT

      - name: Execute backup command
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump "$DATABASE_URL" -F c -f "backup_${{ steps.date.outputs.date }}.dump"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ steps.date.outputs.date }}
          path: backup_${{ steps.date.outputs.date }}.dump
          retention-days: 30